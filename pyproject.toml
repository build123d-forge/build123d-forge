[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "build123d-forge"
version = "0.1.0"
description = "Declarative configurations & reproducible CAD releases for build123d"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "build123d-forge Contributors" }
]
dependencies = [
    "build123d>=0.13.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "jsonschema>=4.0.0",
    "vtk>=9.0.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/build123d-forge/build123d-forge"
Repository = "https://github.com/build123d-forge/build123d-forge.git"
Issues = "https://github.com/build123d-forge/build123d-forge/issues"

[project.optional-dependencies]
render = [
    "resvg-py>=0.5.0",
]
mcp = [
    "build123d-mcp>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "build123d-mcp>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "build123d-mcp>=0.3.0",
]

[project.scripts]
bforge = "build123d_forge.cli:main"
build123d-forge = "build123d_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/build123d_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
